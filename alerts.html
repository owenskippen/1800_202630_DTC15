<!doctype html>
<html lang="en">
  <head>
    <title>Alerts</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css" />
    <script type="module" src="/src/site-navbar.js"></script>
    <script type="module" src="/src/site-footer.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
    <site-navbar></site-navbar>

    <!-- Main section of page-->
    <main class="container py-4">
      <h1>Alerts</h1>
      <section class="mb-4">
        <h2>Scam Alerts</h2>
        <div id="scamAlerts">
          <button type="button" class="card w-100 p-3 text-start alert-card">
            <strong>Fake delivery text</strong>
            <span
              >A text message asks you to pay a fee to receive a package.</span
            >
            <span class="alert-details" hidden>
              Example message: “Your package is on hold. Pay the delivery fee to
              continue.”
            </span>
          </button>
        </div>
      </section>
      <section>
        <h2>Breach Alerts</h2>
        <div id="breachAlerts">
          <button type="button" class="card w-100 p-3 text-start alert-card">
            <strong>Example data breach</strong>
            <span
              >A website reports that some account information was
              exposed.</span
            >
            <span class="alert-details" hidden>
              Example breach details: Email addresses and usernames were
              exposed.
            </span>
          </button>
        </div>
      </section>
    </main>
    <!-- Main section of page end-->

    <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/alerts.js"></script>
  </body>
</html>
