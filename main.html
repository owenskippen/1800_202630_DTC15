<!doctype html>
<html lang="en">

<head>
  <title>Home</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Other libraries go here -->
  <link rel="stylesheet" href="./styles/style.css" />
  <script type="module" src="/src/site-navbar.js"></script>
  <script type="module" src="/src/site-footer.js"></script>
</head>

<body>
  <!------------------------------>
  <!-- Your HTML Layout go here -->
  <!------------------------------>
  <!-- Stuff for body goes here -->

  <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
  <site-navbar></site-navbar>

  <!-- Main section of page-->
  <main class="home-page container py-4">
    <!-- Greeting (#userName gets the real name from Firebase in Sprint 2) -->
    <section class="text-center mb-4">
      <h1 class="fw-bold">Welcome, <span id="userName">user</span>!</h1>
      <p class="lead">What would you like to do today?</p>
    </section>

    <!-- Big buttons for each main feature -->
    <!-- 2 x 2 on tablets and up, 1 column on phones -->
    <section class="home-buttons row row-cols-1 row-cols-sm-2 g-3">
      <div class="col"><a href="./scanner.html" class="home-btn" id="checkLinkBtn">Check a Link</a></div>
      <div class="col"><a href="./report.html" class="home-btn" id="reportScamBtn">Report a Scam</a></div>
      <div class="col"><a href="./alerts.html" class="home-btn" id="alertsBtn">Alerts</a></div>
      <div class="col"><a href="./tips.html" class="home-btn" id="tipsBtn">Safety Tips</a></div>
    </section>

    <!-- Recent activity (filled from the database in Sprint 2) -->
    <section class="recent-activity mt-5">
      <h2>Recent Activity</h2>
      <div id="recentActivity">
        <p>No recent activity yet.</p>
      </div>
    </section>
  </main>
  <!-- Main section of page end-->

  <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
  <site-footer></site-footer>

  <!---------------------------------------------->
  <!-- Your own JavaScript functions go here    -->
  <!---------------------------------------------->

  <!-- Link to scripts of your own -->
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/home.js"></script>
</body>

</html>
