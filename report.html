<!doctype html>
<html lang="en">
  <head>
    <title>Report a Scam</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css" />
    <script type="module" src="/src/site-navbar.js"></script>
    <script type="module" src="/src/site-footer.js"></script>
    <script type="module" src="/src/back-button.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
    <site-navbar></site-navbar>

    <!-- Main section of page-->
    <main class="container px-4 py-5">
      <back-button></back-button>

      <div class="hero-section shadow rounded-3xl mx-auto p-4 p-md-5" style="max-width: 800px;">
    
        <!-- Heading -->
        <div class="text-center mb-4">
          <h1 class="display-6 fw-bold text-body-brand">
            Report a Scam
          </h1>
          <p class="text-secondary mb-0">
            Help others stay safe by reporting suspicious websites or scams.
          </p>
        </div>
    
        <!-- Report form -->
        <form id="report-form">
    
          <!-- Suspicious URL -->
          <div class="mb-4">
            <label for="reportedURL" class="form-label fw-semibold">
              Suspicious URL (optional)
            </label>
            <input type="url" class="form-control form-control-lg rounded-3" id="reportedURL"
              placeholder="https://example.com" />
          </div>
    
          <!-- Report type -->
          <div class="mb-4">
            <label for="reportType" class="form-label fw-semibold">
              Report Type
            </label>
            <select class="form-select form-select-lg rounded-3" id="reportType" required>
              <option value="">Select a report type</option>
              <option value="phishing">Phishing</option>
              <option value="fake-website">Fake website</option>
              <option value="email-scam">Email scam</option>
              <option value="text-scam">Text message scam</option>
              <option value="other">Other</option>
            </select>
          </div>
    
          <!-- Description -->
          <div class="mb-4">
            <label for="description" class="form-label fw-semibold">
              Description
            </label>
            <textarea class="form-control rounded-3" id="description" rows="4" placeholder="Describe what happened..."
              required></textarea>
          </div>
    
          <!-- Submit button -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg shadow">
              Submit Report
            </button>
          </div>
    
          <!-- Report status -->
          <p id="report-status" class="text-center mt-3 mb-0" aria-live="polite"></p>
    
        </form>
      </div>
    </main>
    <!-- Main section of page end-->

    <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>

    <script type="module" src="./src/report.js"></script>
  </body>
</html>
