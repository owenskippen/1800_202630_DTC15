<!doctype html>
<html lang="en">
  <head>
    <title>Report a Scam</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css" />
    <script type="module" src="/src/site-navbar.js"></script>
    <script type="module" src="/src/site-footer.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
    <site-navbar></site-navbar>

    <!-- Main section of page-->
    <main class="container py-4">
      <h1>Report a Scam</h1>
      <p>Help others stay safe by reporting suspicious websites or scams.</p>
      <form action="report-form">
        <div class="mb-3">
          <label for="reportedURL" class="form-label">
            Suspicious URL (optional)>
          </label>
          <input
            type="text"
            class="form-control"
            id="reportedURL"
            placeholder="https://example.com"
          />
        </div>
        <div class="mb-3">
          <label for="reportType" class="form-label"> report Type </label>
          <select class="form-select" id="reportType" required>
            <option value="">Select a report type</option>
            <option value="phishing">Phishing</option>
            <option value="fake-website">Fake website</option>
            <option value="email-scam">Email-scam</option>
            <option value="text-scam">Text Message Scam</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label"> description </label>
          <textarea
            class="form-control"
            id="description"
            rows="4"
            placeholder="Describe what happened..."
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary">submit report</button>
        <p id="report-status" class="mt-3" role="status"></p>
      </form>
    </main>
    <!-- Main section of page end-->

    <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>

    <script type="module" src="./src/report.js"></script>
  </body>
</html>
