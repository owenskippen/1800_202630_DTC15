<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css" />
    <script type="module" src="/src/site-navbar.js"></script>
    <script type="module" src="/src/site-footer.js"></script>
    <script type="module" src="/src/back-button.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
    <site-navbar></site-navbar>

    <!-- Main section of page-->
        <main class="container px-4 py-5">
          <back-button></back-button>

          <div class="hero-section shadow rounded-3xl mx-auto p-4 p-md-5" style="max-width: 800px;">
        
            <!-- Heading -->
            <div class="text-center mb-4">
              <h1 class="display-6 fw-bold text-body-brand">
                Check Data Breaches
              </h1>
              <p class="text-secondary mb-0">
                Find out if your email address has appeared in any known data breaches.
              </p>
            </div>
        
            <!-- Email check form -->
            <form id="emailCheckForm">
        
              <!-- Email input -->
              <div class="mb-4">
                <label for="emailInput" class="form-label fw-semibold">
                  Enter your email address
                </label>
        
                <input type="email" id="emailInput" class="form-control form-control-lg rounded-3"
                  placeholder="example@email.com" required />
              </div>
        
              <!-- Submit button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg shadow">
                  Check Email
                </button>
              </div>
        
              <!-- Status message -->
              <div id="emailCheckMessage" class="text-center mt-3" aria-live="polite"></div>
        
              <!-- Breach results -->
              <div id="emailResults" class="mt-4"></div>
        
            </form>
          </div>
        </main>
    <!-- Main section of page end-->

    <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/breaches.js"></script>
  </body>
</html>
