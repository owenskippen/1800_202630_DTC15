<!doctype html>
<html lang="en">

<head>
  <title>Scan a Link</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Other libraries go here -->
  <link rel="stylesheet" href="./styles/style.css" />
  <script type="module" src="/src/site-navbar.js"></script>
  <script type="module" src="/src/site-footer.js"></script>
</head>

<body>
  <!------------------------------>
  <!-- Your HTML Layout go here -->
  <!------------------------------>
  <!-- Stuff for body goes here -->

  <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
  <site-navbar></site-navbar>

  <!-- Main section of page-->
  <main class="container px-4 py-5">
    <div class="hero-section shadow rounded-3xl mx-auto p-4 p-md-5" style="max-width: 800px;">
      <!-- Heading -->
      <div class="text-center mb-4">
        <h1 class="display-6 fw-bold text-body-brand">
          Scan a Link
        </h1>
        <p class="text-secondary mb-0">
          Check a website before you visit it.
        </p>
      </div>
      <!-- URL input -->
      <div class="mb-4">
        <label for="linkInput" class="form-label fw-semibold">
          Enter a website URL
        </label>
        <input type="url" class="form-control form-control-lg rounded-3" id="linkInput"
          placeholder="https://example.com">
      </div>
      <!-- Scan button -->
      <div class="d-grid mb-4">
        <button id="scanButton" type="button" class="btn btn-primary btn-lg">
          Scan Link
        </button>

        <!-- Where scanning messages and stuff will appear -->
        <p id="scanMessage" class="text-center mt-3" aria-live="polite"></p>

        <!-- Scan status light (amber pulse = scanning, green = done) -->
        <div id="scanStatus" class="scan-status" role="status" aria-live="polite" hidden>
          <span id="scanStatusLight" class="scan-status-light"></span>
          <span id="scanStatusText"></span>
        </div>

        <button id="checkResultButton" type="button" class="btn btn-outline-primary btn-lg mt-2" hidden>
          Check Results
        </button>

        <div id="scanResults" class="mt-4 text-center" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <!-- Main section of page end-->

  <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
  <site-footer></site-footer>

  <!---------------------------------------------->
  <!-- Your own JavaScript functions go here    -->
  <!---------------------------------------------->

  <!-- Link to scripts of your own -->
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/scanner.js"></script>
</body>

</html>
