<!doctype html>
<html lang="en">
  <head>
    <title>Safety Tips & Help</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/tips.css" />
    <script type="module" src="/src/site-navbar.js"></script>
    <script type="module" src="/src/site-footer.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Navbar (Look in src.site-navbar.js if you want to change the code)-->
    <site-navbar></site-navbar>

    <!-- Main section of page-->
    <main class="tips-page container py-4">
      <section class="tips-header text-center mb-4">
        <h1>Stay Safe Online</h1>
        <p>Here are some simple tips to help you avoid online scams.</p>
      </section>

      <section class="tips-section">
        <h2>Safety Tips</h2>
        <div class="tips-container row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
          <!-- This will be removed in tips.js line ~50 -->
          <div class="loading-tips text-center">
            <p>Loading tips...</p>
          </div>
          
          <!-- tips.js will put the Firestore tips here!!! -->
        </div>
      </section>

      <!-- Add a Tip -->
      <section class="help-section bg-light p-4 rounded mt-4">
        <h2>Add Your Own Safety Tip</h2>
        <p>Share a safety tip that could help other users.</p>
        <form id="addTipForm">
          <div class="mb-3">
            <input type="text" id="tipTitle" class="form-control" placeholder="Tip title" required>
          </div>
          <div class="mb-3">
            <textarea id="tipDescription" class="form-control" placeholder="Write your safety tip" rows="4"
              required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">
            Add Tip
          </button>
          <p id="tipMessage" class="mt-3"></p>
        </form>
      </section>

      <section class="help-section bg-light p-4 rounded mt-4">
        <h2>Need help?</h2>
        <p>
          If you think you have been scammed, stop responding and ask for help.
        </p>
      </section>
    </main>
    <!-- Main section of page end-->

    <!-- Footer (Look in src.site-footer.js if you want to change the code)-->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/tips.js"></script>
  </body>
</html>
